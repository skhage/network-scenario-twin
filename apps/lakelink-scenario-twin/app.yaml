# Lakelink Fiber Scenario Twin (lakelink-scenario-twin) - the ONE app for network_scenario_twin (D-004/D-006)
# Tag: telco_project: network_scenario_twin
command: ['npm', 'run', 'start']
env:
  # Lakebase twin-state database resource (key: twin-state) injects PGHOST/PGDATABASE/PGUSER/PGPORT/PGSSLMODE.
  - name: TWIN_SCHEMA
    value: twin_app
  # Lakelink Fiber Splice supervisor endpoint (D-013; app SP holds CAN_QUERY)
  - name: ASSISTANT_ENDPOINT
    value: 'mas-4a251ff6-endpoint'
  # Genie mode fallback: Genie space 'Lakelink Fiber Network Scenario Twin' (used only if the Splice endpoint fails)
  - name: GENIE_SPACE_ID
    value: '01f1e76a824b11f3819e54acb220681f'
  - name: STALE_HOURS
    value: '24'
