# Lakelink Fiber Scenario Twin (lakelink-scenario-twin) - the ONE app for network_scenario_twin (D-004/D-006)
# Tag: telco_project: network_scenario_twin
command: ['npm', 'run', 'start']
env:
  # Lakebase twin-state database resource (key: twin-state) injects PGHOST/PGDATABASE/PGUSER/PGPORT/PGSSLMODE.
  - name: TWIN_SCHEMA
    value: twin_app
  # Lakelink Fiber Twin Copilot supervisor endpoint (app SP needs CAN_QUERY; granted by CEO, see P5-APP-COPILOT-QUERY-GRANT)
  - name: COPILOT_ENDPOINT
    value: 'mas-4a251ff6-endpoint'
  - name: STALE_HOURS
    value: '24'
