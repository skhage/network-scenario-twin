# Daily refresh job for the Lakelink Fiber Network Scenario Twin: runs a refresh of the twin
# pipeline (bronze -> silver -> gold). Serverless (no cluster definition). The schedule ships
# PAUSED; @pm unpauses it once the dev deploy is bound and verified.
# Tag: telco_project: network_scenario_twin (set here and by presets.tags). Owner: @devops (P5-BUNDLE-RESOURCES).
resources:
  jobs:
    twin_refresh:
      name: lakelink-network-scenario-twin-refresh
      description: Lakelink Fiber Network Scenario Twin - daily refresh of the twin pipeline into ${var.catalog}.${var.schema}.
      max_concurrent_runs: 1
      tasks:
        - task_key: refresh_twin_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.twin_pipeline.id}
            full_refresh: false
      schedule:
        quartz_cron_expression: '0 0 5 * * ?'
        timezone_id: America/Chicago
        pause_status: PAUSED
      tags:
        telco_project: network_scenario_twin
